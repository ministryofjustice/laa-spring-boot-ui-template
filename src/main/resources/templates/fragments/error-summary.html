<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="error-summary(errors)" th:if="${errors != null and !#lists.isEmpty(errors)}"
     class="govuk-error-summary" data-module="govuk-error-summary">
    <div role="alert">
        <h2 class="govuk-error-summary__title" th:text="#{errors.summary.title}">There is a problem</h2>
        <div class="govuk-error-summary__body">
            <ul class="govuk-list govuk-error-summary__list">
                <li th:each="error : ${errors}">
                    <a th:href="${'#' + error.field}" th:text="${error.message}"></a>
                </li>
            </ul>
        </div>
    </div>
</div>
</html>
