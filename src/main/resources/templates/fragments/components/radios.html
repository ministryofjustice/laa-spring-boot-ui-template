<section class="govuk-!-margin-bottom-8" th:fragment="radios" xmlns:th="http://www.thymeleaf.org">
    <h3 class="govuk-heading-m" th:text="#{components.radios.heading}">Radios</h3>
    <div class="govuk-form-group">
        <fieldset class="govuk-fieldset">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--s">
                <span class="govuk-fieldset__heading" th:text="#{components.radios.legend}">Where do you live?</span>
            </legend>
            <div class="govuk-radios" data-module="govuk-radios">
                <div class="govuk-radios__item">
                    <input class="govuk-radios__input" id="where-do-you-live" name="where-do-you-live" type="radio" value="england">
                    <label class="govuk-label govuk-radios__label" for="where-do-you-live" th:text="#{components.radios.option1}">England</label>
                </div>
                <div class="govuk-radios__item">
                    <input class="govuk-radios__input" id="where-do-you-live-2" name="where-do-you-live" type="radio" value="scotland">
                    <label class="govuk-label govuk-radios__label" for="where-do-you-live-2" th:text="#{components.radios.option2}">Scotland</label>
                </div>
                <div class="govuk-radios__item">
                    <input class="govuk-radios__input" id="where-do-you-live-3" name="where-do-you-live" type="radio" value="wales">
                    <label class="govuk-label govuk-radios__label" for="where-do-you-live-3" th:text="#{components.radios.option3}">Wales</label>
                </div>
                <div class="govuk-radios__item">
                    <input class="govuk-radios__input" id="where-do-you-live-4" name="where-do-you-live" type="radio" value="northern-ireland">
                    <label class="govuk-label govuk-radios__label" for="where-do-you-live-4" th:text="#{components.radios.option4}">Northern Ireland</label>
                </div>
            </div>
        </fieldset>
    </div>
</section>
