<!DOCTYPE html>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head(#{error.404.page.title})}"></head>

<body class="govuk-template__body govuk-frontend-supported">
<a href="#main-content" class="govuk-skip-link" data-module="govuk-skip-link" th:text="#{common.skip.link}">Skip to main content</a>
<header th:replace="~{fragments/templates :: header}"></header>

<div class="govuk-width-container">
    <main class="govuk-main-wrapper govuk-main-wrapper--l" id="main-content" role="main">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">
                <h1 class="govuk-heading-l" th:text="#{error.404.heading}">Page not found</h1>
                <p class="govuk-body" th:text="#{error.404.body1}">If you typed the web address, check it is correct.</p>
                <p class="govuk-body" th:text="#{error.404.body2}">If you pasted the web address, check you copied the entire address.</p>
                <a href="/" class="govuk-link" th:text="#{error.404.home.link}">Go to homepage</a>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
